name: fetch-job-boards
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
  push:
    paths: ["board-fetch/fetch.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python board-fetch/fetch.py
      - name: Commit results
        run: |
          git config user.name "board-fetch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add board-fetch/results board-fetch/candidates
          git commit -m "board fetch $(date -u +%F)" || echo "no changes"
          git push
