name: scan2
on:
  push:
    paths:
      - 'scan2.py'
      - '.github/workflows/scan2.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out
      - run: python3 scan2.py 2>&1 | tee out/desc2log.txt
      - if: always()
        run: |
          git config user.name "scan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add out/ || true
          git commit -m "desc results [skip ci]" || echo nothing
          git push 2>&1 || echo push failed