name: scan
on:
  push:
    paths:
      - 'scan.py'
      - '.github/workflows/scan.yml'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out/alltitles out/matches
      - run: python3 scan.py
      - run: |
          git config user.name "scan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add out/ || true
          git commit -m "scan results [skip ci]" || echo "nothing"
          git push
