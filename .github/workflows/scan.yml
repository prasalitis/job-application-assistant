name: Job board scan

on:
  push:
    branches: ['sweep/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scan.py
      - run: |
          git config user.name "scan-bot"
          git config user.email "action@users.noreply.github.com"
          git add results
          git commit -m "scan results $(date -u +%FT%TZ)" || echo "no changes"
          git push
